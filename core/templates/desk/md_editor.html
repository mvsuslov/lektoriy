{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MD-редактор</title>
<link rel="stylesheet" href="{% static 'md/katex.min.css' %}">
<script src="{% static 'md/katex.min.js' %}"></script>
<script src="{% static 'md/auto-render.min.js' %}"></script>
<script src="{% static 'md/marked.min.js' %}"></script>
<link rel="stylesheet" href="{% static 'md/github.min.css' %}">
<script src="{% static 'md/highlight.min.js' %}"></script>
<style>
:root{--bg:#f7f7f8;--panel:#fff;--border:#e5e5ea;--accent:#007aff;--text:#1d1d1f;--text-muted:#8e8e93;--mono:'SF Mono','Menlo','Monaco','Consolas',monospace;--sans:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',system-ui,sans-serif;--serif:'Georgia','Times New Roman',serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--sans);background:var(--bg);color:var(--text);overflow:hidden}
#toolbar{position:fixed;top:0;left:0;right:0;height:48px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 12px;gap:6px;font-size:13px;overflow-x:auto;z-index:100}
#toolbar .brand{font-weight:700;font-size:15px;color:var(--accent);margin-right:8px;white-space:nowrap}
#toolbar .sep{width:1px;height:24px;background:var(--border);margin:0 4px;flex-shrink:0}
#toolbar button,#toolbar select,#toolbar label{font-family:var(--sans);font-size:12px;padding:4px 10px;border:1px solid var(--border);background:#fff;border-radius:6px;cursor:pointer;white-space:nowrap;transition:background .15s}
#toolbar button:hover{background:#f0f0f5}
#toolbar button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
#main{position:fixed;top:48px;left:0;right:0;bottom:0;display:flex;overflow:hidden}
#editor-pane{flex:1;display:flex;flex-direction:column;border-right:1px solid var(--border);min-width:0}
#editor-pane .pane-header{height:36px;display:flex;align-items:center;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--border);font-size:11px;color:var(--text-muted);gap:10px;flex-shrink:0}
#editor{flex:1;width:100%;border:none;outline:none;resize:none;padding:20px 24px;font-family:var(--mono);font-size:14px;line-height:1.65;color:var(--text);background:var(--panel);tab-size:2}
#preview-pane{flex:1;display:flex;flex-direction:column;min-width:0}
#preview-pane .pane-header{height:36px;display:flex;align-items:center;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--border);font-size:11px;color:var(--text-muted);gap:10px;flex-shrink:0}
#preview{flex:1;overflow-y:auto;padding:28px 36px;background:var(--panel);font-family:var(--serif);font-size:15px;line-height:1.75;color:var(--text);position:relative}
#preview h1{font-size:26px;margin:20px 0 10px;font-weight:700;border-bottom:1px solid #eee;padding-bottom:6px}
#preview h2{font-size:22px;margin:18px 0 8px;font-weight:600}
#preview h3{font-size:18px;margin:16px 0 6px;font-weight:600}
#preview h4{font-size:16px;margin:14px 0 6px;font-weight:600}
#preview p{margin:8px 0}
#preview ul,#preview ol{margin:8px 0 8px 24px}
#preview li{margin:3px 0}
#preview blockquote{border-left:3px solid var(--accent);margin:10px 0;padding:6px 14px;color:#555;background:#f5f8fc}
#preview code{font-family:var(--mono);background:#f4f4f4;padding:2px 5px;border-radius:3px;font-size:13px}
#preview pre{background:#282c34;color:#abb2bf;padding:14px 16px;border-radius:6px;overflow-x:auto;margin:10px 0;font-size:13px;line-height:1.5}
#preview pre code{background:transparent;padding:0;color:inherit}
#preview hr{border:none;border-top:1px solid #ddd;margin:16px 0}
#preview a{color:var(--accent)}
#preview table{border-collapse:collapse;margin:10px 0}
#preview th,#preview td{border:1px solid #ddd;padding:6px 12px;font-size:14px}
#preview th{background:#f0f0f5}
#preview img{max-width:100%;border-radius:4px}
#preview .katex-display{margin:14px 0}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:#333;color:#fff;padding:10px 22px;border-radius:8px;font-size:13px;transition:transform .3s;z-index:1000;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0)}
@media(max-width:700px){
  #main{flex-direction:column}
  #editor-pane{flex:1;border-right:none;border-bottom:1px solid var(--border)}
  #preview-pane{flex:1}
}
.stat{font-size:11px;color:var(--text-muted);white-space:nowrap}
.stat b{color:var(--text)}
</style>
</head>
<body>
<div id="toolbar">
  <span class="brand">∑ MD</span>
  <div class="sep"></div>
  <button onclick="insertMd('**','**')"><b>B</b></button>
  <button onclick="insertMd('*','*')"><i>I</i></button>
  <button onclick="insertMd('$','$')">∑</button>
  <button onclick="insertBlock('$$\n','\n$$')">∫</button>
  <div class="sep"></div>
  <select id="sel-heading" onchange="applyHeading(this.value);this.selectedIndex=0;">
    <option value="">H…</option>
    <option value="1">H1</option>
    <option value="2">H2</option>
    <option value="3">H3</option>
  </select>
  <button onclick="insertPrefix('- ')">• List</button>
  <button onclick="insertPrefix('1. ')">1. List</button>
  <button onclick="insertBlock('| Col 1 | Col 2 |\n|-------|-------|\n| a | b |\n','')">▦</button>
  <div class="sep"></div>
  <button onclick="uploadImage()" title="Вставить картинку">🖼</button>
  <input type="file" id="img-input" accept="image/*" style="display:none" onchange="doUploadImage(event)">
  <div class="sep"></div>
  <button class="primary" onclick="sendToParent()" title="Перенести текст в форму материала">💾 Перенести в материал</button>
</div>

<div id="main">
  <div id="editor-pane">
    <div class="pane-header">
      <span>MARKDOWN</span>
      <span class="stat" id="stat-chars">Символов: <b>0</b></span>
      <span class="stat" id="stat-formulas" style="margin-left:auto">Формул: <b>0</b></span>
    </div>
    <textarea id="editor" spellcheck="false" placeholder="# Начните писать...&#10;&#10;Инлайн-формула: $E=mc^2$&#10;Блочная: $$\int_0^1 f(x)\,dx$$"></textarea>
  </div>
  <div id="preview-pane">
    <div class="pane-header"><span>ПРЕВЬЮ</span></div>
    <div id="preview"></div>
  </div>
</div>

<div id="toast"></div>

<script>
const editor = document.getElementById('editor');
const preview = document.getElementById('preview');
let renderTimer;

marked.setOptions({ breaks: false, gfm: true, headerIds: true, mangle: false });

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function render() {
  const src = editor.value;
  let idx = 0;
  const mathBlocks = [];
  let processed = src.replace(/\$\$([\s\S]+?)\$\$/g, (m, inner) => {
    const key = `%%MATH${idx++}%%`;
    mathBlocks.push({ key, inner, display: true });
    return key;
  });
  processed = processed.replace(/(?<![\\$])\$(?!\$)([^$\n]+?)\$(?!\$)/g, (m, inner) => {
    const key = `%%MATH${idx++}%%`;
    mathBlocks.push({ key, inner, display: false });
    return key;
  });
  let html = marked.parse(processed);
  mathBlocks.forEach(b => {
    try {
      const rendered = katex.renderToString(b.inner, { displayMode: b.display, throwOnError: false });
      html = html.replace(b.key, rendered);
    } catch (e) {
      html = html.replace(b.key, `<span style="color:red">[${e.message}]</span>`);
    }
  });
  preview.innerHTML = html;
  document.getElementById('stat-chars').innerHTML = `Символов: <b>${src.length}</b>`;
  document.getElementById('stat-formulas').innerHTML = `Формул: <b>${mathBlocks.length}</b>`;
  rebuildScrollAnchors();
}

function scheduleRender() { clearTimeout(renderTimer); renderTimer = setTimeout(render, 250); }
editor.addEventListener('input', scheduleRender);

function insertMd(before, after) {
  const s = editor.selectionStart, e = editor.selectionEnd;
  const sel = editor.value.substring(s, e);
  editor.value = editor.value.substring(0, s) + before + sel + after + editor.value.substring(e);
  editor.selectionStart = s + before.length;
  editor.selectionEnd = s + before.length + sel.length;
  editor.focus();
  scheduleRender();
}

function insertBlock(before, after) { insertMd(before, after); }

function insertPrefix(prefix) {
  const s = editor.selectionStart;
  const lineStart = editor.value.lastIndexOf('\n', s - 1) + 1;
  editor.value = editor.value.substring(0, lineStart) + prefix + editor.value.substring(lineStart);
  editor.selectionStart = editor.selectionEnd = s + prefix.length;
  editor.focus();
  scheduleRender();
}

function applyHeading(level) {
  const s = editor.selectionStart;
  const lineStart = editor.value.lastIndexOf('\n', s - 1) + 1;
  let lineEnd = editor.value.indexOf('\n', s);
  if (lineEnd === -1) lineEnd = editor.value.length;
  let line = editor.value.substring(lineStart, lineEnd).replace(/^#{1,6}\s*/, '');
  const prefix = level > 0 ? '#'.repeat(parseInt(level)) + ' ' : '';
  editor.value = editor.value.substring(0, lineStart) + prefix + line + editor.value.substring(lineEnd);
  editor.selectionStart = editor.selectionEnd = lineStart + prefix.length + line.length;
  editor.focus();
  scheduleRender();
}

/* ═══ Синхронная прокрутка по якорям (заголовкам) ═══ */
let isSyncingScroll = false;
let scrollAnchors = [{ editorY: 0, previewY: 0 }];
let editorMirror = null;

function getEditorMirror() {
  if (!editorMirror) {
    editorMirror = document.createElement('div');
    editorMirror.style.position = 'absolute';
    editorMirror.style.visibility = 'hidden';
    editorMirror.style.top = '0';
    editorMirror.style.left = '-99999px';
    editorMirror.style.whiteSpace = 'pre-wrap';
    editorMirror.style.wordWrap = 'break-word';
    editorMirror.style.overflowWrap = 'break-word';
    document.body.appendChild(editorMirror);
  }
  const cs = window.getComputedStyle(editor);
  editorMirror.style.boxSizing   = cs.boxSizing;
  editorMirror.style.width       = editor.clientWidth + 'px';
  editorMirror.style.font        = cs.font;
  editorMirror.style.fontFamily  = cs.fontFamily;
  editorMirror.style.fontSize    = cs.fontSize;
  editorMirror.style.fontWeight  = cs.fontWeight;
  editorMirror.style.lineHeight  = cs.lineHeight;
  editorMirror.style.letterSpacing = cs.letterSpacing;
  editorMirror.style.wordSpacing = cs.wordSpacing;
  editorMirror.style.tabSize     = cs.tabSize;
  editorMirror.style.padding     = cs.padding;
  editorMirror.style.borderWidth = cs.borderWidth;
  editorMirror.style.borderStyle = cs.borderStyle;
  return editorMirror;
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function rebuildScrollAnchors() {
  const headings = preview.querySelectorAll('h1, h2, h3, h4, h5, h6');
  const val = editor.value;

  const editorMax  = Math.max(0, editor.scrollHeight  - editor.clientHeight);
  const previewMax = Math.max(0, preview.scrollHeight - preview.clientHeight);

  if (headings.length === 0) {
    scrollAnchors = [{ editorY: 0, previewY: 0 }, { editorY: editorMax, previewY: previewMax }];
    return;
  }

  let searchFrom = 0;
  const charIndices = [];
  headings.forEach(h => {
    const text = h.textContent;
    if (!text) { charIndices.push(null); return; }
    const idx = val.indexOf(text, searchFrom);
    if (idx === -1) { charIndices.push(null); return; }
    searchFrom = idx + text.length;
    charIndices.push(idx);
  });

  const mirror = getEditorMirror();
  let html = '';
  let last = 0;
  charIndices.forEach((idx, i) => {
    if (idx === null) return;
    html += escapeHtml(val.substring(last, idx));
    html += `<span data-a="${i}"></span>`;
    last = idx;
  });
  html += escapeHtml(val.substring(last));
  mirror.innerHTML = html;

  const anchors = [{ editorY: 0, previewY: 0 }];
  headings.forEach((h, i) => {
    if (charIndices[i] === null) return;
    const span = mirror.querySelector(`span[data-a="${i}"]`);
    if (!span) return;
    anchors.push({ editorY: span.offsetTop, previewY: h.offsetTop });
  });

  anchors.push({ editorY: editorMax, previewY: previewMax });
  anchors.sort((a, b) => a.editorY - b.editorY);
  scrollAnchors = anchors;
}

function syncScrollByAnchors(source, target, sourceKey, targetKey) {
  if (isSyncingScroll) return;
  isSyncingScroll = true;

  const sY = source.scrollTop;
  const anchors = scrollAnchors;

  let i = 0;
  while (i < anchors.length - 1 && anchors[i + 1][sourceKey] < sY) i++;
  const a = anchors[i];
  const b = anchors[Math.min(i + 1, anchors.length - 1)];

  const segLen = b[sourceKey] - a[sourceKey];
  const ratio = segLen > 0 ? (sY - a[sourceKey]) / segLen : 0;

  target.scrollTop = a[targetKey] + ratio * (b[targetKey] - a[targetKey]);

  requestAnimationFrame(() => { isSyncingScroll = false; });
}

editor.addEventListener('scroll', () => syncScrollByAnchors(editor, preview, 'editorY', 'previewY'));
preview.addEventListener('scroll', () => syncScrollByAnchors(preview, editor, 'previewY', 'editorY'));
window.addEventListener('resize', rebuildScrollAnchors);
/* ═══ /Синхронная прокрутка ═══ */

editor.addEventListener('keydown', function(e) {
  if ((e.ctrlKey || e.metaKey) && e.key === 'b') { e.preventDefault(); insertMd('**','**'); }
  if ((e.ctrlKey || e.metaKey) && e.key === 'i') { e.preventDefault(); insertMd('*','*'); }
  if ((e.ctrlKey || e.metaKey) && e.key === 'm') { e.preventDefault(); insertMd('$','$'); }
  if (e.key === 'Tab') {
    e.preventDefault();
    const s = editor.selectionStart;
    editor.value = editor.value.substring(0, s) + '  ' + editor.value.substring(editor.selectionEnd);
    editor.selectionStart = editor.selectionEnd = s + 2;
    scheduleRender();
  }
});

/* ── Загрузка картинки ── */
function getCookie(name) {
  const m = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
  return m ? m.pop() : '';
}
function uploadImage() { document.getElementById('img-input').click(); }
async function doUploadImage(ev) {
  const file = ev.target.files[0];
  if (!file) return;
  const fd = new FormData();
  fd.append('image', file);
  try {
    const r = await fetch('/desk/md-editor/upload/', {
      method: 'POST',
      headers: {'X-CSRFToken': getCookie('csrftoken')},
      body: fd,
    });
    const d = await r.json();
    if (d.url) {
      insertMd(`![${file.name}](${d.url})`, '');
      showToast('✓ Картинка загружена');
    } else {
      showToast('⚠ ' + (d.error || 'Ошибка'));
    }
  } catch(e) { showToast('⚠ Ошибка сети'); }
  ev.target.value = '';
}

/* ── Отправка родителю ── */
function sendToParent() {
  window.parent.postMessage({type: 'scimd-content', text: editor.value}, '*');
  showToast('✓ Перенесено в материал');
}
window.addEventListener('message', (e) => {
  if (e.data && e.data.type === 'scimd-load') {
    editor.value = e.data.text || '';
    render();
  }
});
window.addEventListener('load', () => {
  window.parent.postMessage({type: 'scimd-ready'}, '*');
});

render();
</script>
</body>
</html>
